name: CI

# Зачем: ветка master уже приезжала красной (43 упавших e2e из-за одной строки в
# 14945ed), и узнали мы об этом только через три недели, вручную. Проверка должна
# срабатывать на пуше, а не когда кто-то соберётся прогнать тесты сам.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # e2e поднимают Postgres через testcontainers — на ubuntu-раннере Docker есть из коробки,
    # отдельный services: postgres не нужен (и не подойдёт: тесты сами задают адрес контейнера).
    env:
      NODE_ENV: development
      LOG_LEVEL: error
      LOG_PRETTY: 'false'
      # Значения-заглушки: e2e переопределяют DB_* на адрес поднятого контейнера
      # (test/support/test-database.ts), но src/data-source.ts валидирует env уже на импорте,
      # поэтому переменные обязаны существовать до старта jest.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: test
      DB_PASS: test
      DB_NAME: test
      CORS_ORIGINS: http://localhost:3001
      JWT_SECRET: ci-access-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long
      BITRIX_WEBHOOK: http://bitrix-webhook.invalid
      MEILI_HOST: http://meilisearch.invalid
      MEILI_MASTER_KEY: ci-master-key-invalid
      MEILI_SEARCH_KEY: ci-search-key-invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Мажор, а не файл-версия: engines в package.json задан диапазоном (">=22.22"),
          # setup-node такой диапазон читает неустойчиво. Свежая 22.x его удовлетворяет,
          # иначе yarn откажется запускать скрипты (проверка engines у yarn 1 включена).
          node-version: '22'
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Порядок от дешёвого к дорогому: typecheck ~30 с, юнит-тесты ~5 с, e2e ~2.5 мин.
      # if: always() — чтобы один падающий шаг не скрывал состояние остальных: иначе после
      # красного typecheck непонятно, сломаны тесты или нет, и правится вслепую.
      - name: typecheck
        run: yarn typecheck

      - name: lint
        if: always()
        # Именно lint:ci, а не lint: у второго стоит --fix, он молча правит файлы в раннере
        # и потому всегда зелёный на всём, что автоправимо.
        run: yarn lint:ci

      - name: unit
        if: always()
        run: yarn test

      - name: e2e
        if: always()
        # runInBand обязателен: каждый сьют поднимает собственный Postgres, параллельный
        # запуск упирается в память раннера.
        run: yarn test:e2e --runInBand
