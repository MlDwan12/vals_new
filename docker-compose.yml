services:
  postgres:
    image: postgres:16
    container_name: vals_new_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Только localhost — Postgres не должен торчать наружу на 0.0.0.0 (M9 code review).
      - '127.0.0.1:${DB_PORT}:5432'
    volumes:
      - vals_new_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: vals_new_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: 'true'
    ports:
      # Только localhost (M9 code review).
      - '127.0.0.1:7700:7700'
    volumes:
      - vals_new_meilisearch_data:/meili_data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vals_new_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      # Порт postgres внутри docker-сети всегда 5432 — DB_PORT из .env (host-side проброс) сюда не
      # подходит: если он переопределён (например, 5433, чтобы не конфликтовать с локальным
      # postgres на хосте), api пытался бы достучаться до postgres:5433, которого внутри сети нет
      # (M9 code review).
      DB_PORT: '5432'
      MEILI_HOST: http://meilisearch:7700
    ports:
      - '${APP_PORT}:${APP_PORT}'
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./uploads:/app/uploads
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

volumes:
  vals_new_postgres_data:
  vals_new_meilisearch_data:
